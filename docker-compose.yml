version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anticheat_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/onlineexam
      - JWT_SECRET=anticheat_docker_production_jwt_secret_2025
      # Optional: Add SMTP credentials for OTP emails
      # - EMAIL_USER=your_email@gmail.com
      # - EMAIL_PASS=your_app_password
    depends_on:
      - mongo
    volumes:
      - uploads-data:/app/server/uploads

  mongo:
    image: mongo:6.0
    container_name: anticheat_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  uploads-data:
